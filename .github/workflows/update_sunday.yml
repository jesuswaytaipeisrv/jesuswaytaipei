name: 自動更新主日信息與樣青講堂

on:
  schedule:
    # 每週五 01:00 UTC = 09:00 UTC+8。
    # 本機 launchd 週四 21:00 先跑，這裡隔天早上才跑，作為「本機失敗時的補救層」。
    # 原本兩邊都排週四 21:00，正常週永遠是本機先完成、這裡只會回報「無新內容」，
    # 備援等於從未被驗證過；2026-08-06 本機 push 失敗那次，這裡也同時被 YouTube 限流而漏更新。
    - cron: '0 1 * * 5'
  workflow_dispatch:
    inputs:
      test_alert:
        description: '只測告警管道：發一則測試 Telegram 後照常執行更新'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yt-dlp google-genai

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record initial commit SHA
        id: pre
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Run update script
        id: update
        env:
          # repo secret 名為 GEMINI_API_KEY，腳本讀的環境變數名為 GOOGLE_API_KEY。
          # 2026-09-04 前這裡寫成 secrets.GOOGLE_API_KEY（不存在）→ 注入空字串 → 翻譯被靜默跳過。
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBSITE_DIR: ${{ github.workspace }}
          # 告警走 Telegram（與本機 launchd 同一個管道），不再寄沒人看的信箱
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_HOME_CHANNEL }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python update_sunday.py

      - name: Check for changes and build email body
        id: check
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "${{ steps.pre.outputs.sha }}" != "$CURRENT_SHA" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "commit_msg<<MSGEOF" >> $GITHUB_OUTPUT
            echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
            echo "MSGEOF" >> $GITHUB_OUTPUT
            echo "✅ 網頁已更新並 push"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 無新內容，本週已是最新"
          fi

      - name: Send email notification
        if: steps.check.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: jesuswaytaipeisrv@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【台北樣教會】網站自動更新通知"
          to: jesuswaytaipeisrv@gmail.com
          from: 台北樣教會自動排程 <jesuswaytaipeisrv@gmail.com>
          body: |
            台北樣教會網站已完成本週自動更新。

            ${{ steps.check.outputs.commit_msg }}

            ──────────────────────────
            主日信息：https://jesuswaytaipeisrv.github.io/jesuswaytaipei/sunday.html
            樣青講堂：https://jesuswaytaipeisrv.github.io/jesuswaytaipei/youth.html
            ──────────────────────────
            此信由 GitHub Actions 自動發送，請勿直接回覆。

      - name: Fail the run when dates could not be fetched
        if: steps.update.outputs.date_fetch_failed == 'true'
        run: |
          echo "::error::偵測到符合關鍵字的新影片，但 yt-dlp 抓不到日期，本次未寫入網站。"
          echo "常見原因：YouTube 對 GitHub Actions 執行環境限流／防機器人偵測。"
          echo "處理方式：先重跑本 workflow（Re-run jobs）；仍失敗就在本機手動執行 update_sunday.py 補上。"
          # 告警訊息已由 update_sunday.py 的 notify_failure() 發到 Telegram。
          # 這裡另外把整個 run 標成失敗：2026-07-30～09-04 連續六次限流，
          # workflow 卻全部回報 success，Actions 頁面的綠燈等於說謊；
          # 紅燈同時會觸發 GitHub 內建的排程失敗通知，是 Telegram 之外的第二層訊號。
          exit 1
